coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "**/__tests__/**"
  - "**/node_modules/**"
  - "coverage/**"
  - "*.config.js"
  - "*.config.ts"
  - "*.config.mjs"
  - "jest.setup.js"
  - "next-env.d.ts"
